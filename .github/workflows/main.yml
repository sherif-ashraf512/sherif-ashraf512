name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */2 * * *" # كل ساعتين
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. تحديث ملف لضمان المربعات الخضراء (الـ Green Dots)
      - name: Update activity file
        run: |
          echo "Last Activity: $(date)" > activity.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.txt
          git commit -m "chore: update activity" || echo "No changes"
          git push origin main

      # 3. توليد لعبة الثعبان/باكمان (الأكشن ده بيمسح البروفايل كله صح)
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: sherif-ashraf512
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 4. رفع الملفات لفرع الـ output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
