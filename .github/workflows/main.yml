name: Generate pacman game

on:
  schedule:
    - cron: "0 0 * * *" # يشتغل كل يوم الساعة 12 بالليل
  workflow_dispatch: # يتيح لك تشغيله يدوياً للتجربة
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      
      - name: Checkout code
        uses: actions/checkout@v3

      
      - name: Update activity file for Green Dots
        run: |
          echo "Last Activity: $(date)" > activity.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.txt
          git commit -m "Daily contribution: $(date)" || echo "No changes to commit"
          git push origin main

      # 3. توليد لعبة باكمان
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: sherif-ashraf512 

      
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}